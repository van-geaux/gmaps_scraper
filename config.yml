# CSV-driven Google Maps scraper configuration

# The query CSV is provided at runtime:
# python3 main.py --csvinput queries/dummy_queries.csv

# One persistent SQLite file. Each run creates a separate table inside it.
Database_file: output/gmaps_scraper.sqlite
Output_folder: output

# Browser
Headless: true
# Selenium is published to the same Linux host where the scraper runs.
Browser_remote_url: http://localhost:4444

# Optional authenticated proxy for both Chrome and detailed requests.
Proxy:
  Enabled: true
  Scheme: http
  Host: ${PROXY_HOST}
  Port: ${PROXY_PORT}
  User: ${PROXY_USER}
  Password: ${PROXY_PASSWORD}

# Chrome uses the local gateway in the Selenium Docker network. The gateway
# forwards to the authenticated Proxy settings above.
Browser_proxy:
  Enabled: true
  Scheme: http
  Host: proxy-gateway
  Port: 3128

Log_level: info
