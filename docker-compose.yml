services:
  proxy-gateway:
    build: ./proxy
    environment:
      UPSTREAM_PROXY_HOST: ${PROXY_HOST}
      UPSTREAM_PROXY_PORT: ${PROXY_PORT}
      UPSTREAM_PROXY_USER: ${PROXY_USER}
      UPSTREAM_PROXY_PASSWORD: ${PROXY_PASSWORD}
    expose:
      - "3128"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -x http://127.0.0.1:3128 https://www.google.com/generate_204 -o /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  selenium:
    image: selenium/standalone-chrome:153.0.8010.47-chromedriver-153.0.8010.47-grid-4.49.0-20260909
    shm_size: 2gb
    ports:
      - "4444:4444"
      - "7900:7900"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:4444/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
